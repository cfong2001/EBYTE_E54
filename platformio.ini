; PlatformIO Project Configuration File
;
; Multi-environment setup for ESP32 and ESP32-C6 with TFT Display and EBYTE E54 Radar

[platformio]
default_envs = esp32dev, esp32-s3
src_dir = src

[env]
lib_ldf_mode = deep+
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Common libraries for TFT and Input
lib_deps = 
    https://github.com/AndroidCrypto/TFT_eSPI.git
    mathertel/RotaryEncoder@^1.5.3
    mathertel/OneButton@^2.0.3
        mathieucarbou/ESPAsyncWebServer @ ^3.6.0
    bblanchon/ArduinoJson @ ^7.4.3
    mathieucarbou/AsyncTCP @ ^3.3.2
    FS
    WiFi

[env:esp32dev]
platform = espressif32
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
build_flags =
    -DPIN_ENCODER_A=25
    -DPIN_ENCODER_B=26
    -DPIN_BUTTON=27
    -DRADAR_RX_PIN=16
    -DRADAR_TX_PIN=17
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BLK=4
    -DPIN_KEY0=0
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_ENCODER_A=25
    -DPIN_ENCODER_B=26
    -DPIN_BUTTON=27
    -DRADAR_RX_PIN=16
    -DRADAR_TX_PIN=17
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=14
    -DTFT_BLK=4
    -DPIN_KEY0=0
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000

[env:esp32-wrover-ie]
platform = espressif32
board = esp-wrover-kit
framework = arduino
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BLK=4
    -DPIN_KEY0=0
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
    -DPIN_ENCODER_A=25
    -DPIN_ENCODER_B=26
    -DPIN_BUTTON=27
    -DRADAR_RX_PIN=16
    -DRADAR_TX_PIN=17
    -DDISABLE_ALL_LIBRARY_WARNINGS=1

[env:esp32-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = e101-c6mn4-ps
board_build.partitions = default.csv
framework = arduino
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_MOSI=19
    -DTFT_SCLK=20
    -DTFT_CS=18
    -DTFT_DC=21
    -DTFT_RST=22
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
    -DPIN_ENCODER_A=10
    -DPIN_ENCODER_B=11
    -DPIN_BUTTON=9
    -DRADAR_RX_PIN=16
    -DRADAR_TX_PIN=17
