name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install PlatformIO
      run: python3 -m pip install platformio
    - name: Build C++ Code
      run: pio run -e esp32-s3
    - name: Run C++ Unit Tests
      run: make -C test test
